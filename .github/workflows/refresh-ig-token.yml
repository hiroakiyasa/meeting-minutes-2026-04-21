name: Refresh Instagram Long-Lived Token

on:
  schedule:
    - cron: '0 3 1,20 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh IG token
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${IG_ACCESS_TOKEN:-}" ]]; then
            echo "::error::IG_ACCESS_TOKEN secret not set"
            exit 1
          fi

          RESPONSE=$(curl -sS -G "https://graph.instagram.com/refresh_access_token" \
            -d "grant_type=ig_refresh_token" \
            -d "access_token=${IG_ACCESS_TOKEN}")

          NEW_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          EXPIRES=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('expires_in',''))")

          if [[ -z "$NEW_TOKEN" ]]; then
            echo "::error::refresh failed: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$NEW_TOKEN"
          echo "new_token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"
          echo "Token refreshed (expires in $((EXPIRES / 86400)) days)"

      - name: Update GitHub Secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
          NEW_TOKEN: ${{ steps.refresh.outputs.new_token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::GH_PAT_FOR_SECRETS not set — refreshed but secret NOT updated."
            exit 0
          fi
          gh secret set IG_ACCESS_TOKEN -R "$REPO" --body "$NEW_TOKEN"
          echo "Secret IG_ACCESS_TOKEN updated."

      - name: Verify new token
        env:
          NEW_TOKEN: ${{ steps.refresh.outputs.new_token }}
        run: |
          curl -sS "https://graph.instagram.com/v21.0/me?fields=id,username&access_token=${NEW_TOKEN}" | python3 -m json.tool
