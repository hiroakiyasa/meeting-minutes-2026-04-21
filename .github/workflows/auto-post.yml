name: Auto-post to SNS on incoming

on:
  push:
    paths:
      - 'incoming/**'
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to media file in repo (relative)'
        required: true
        type: string
      mode:
        description: 'image or video'
        required: true
        default: 'image'
        type: choice
        options: [image, video]
      caption:
        description: 'Caption text for ALL platforms (overrides .txt sidecar)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: changed
        env:
          INPUT_FILE: ${{ inputs.file }}
          INPUT_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            FILES="$INPUT_FILE"
            MODE="$INPUT_MODE"
          else
            # Pick the first added media file in incoming/ (skip .txt sidecars)
            FILES=$(git diff --name-only --diff-filter=A HEAD^ HEAD \
              | grep "^incoming/" \
              | grep -viE '\.txt$|\.md$|\.json$' \
              | head -1 || true)
            EXT="${FILES##*.}"
            case "$(echo "$EXT" | tr '[:upper:]' '[:lower:]')" in
              mp4|mov|m4v|webm) MODE=video ;;
              *) MODE=image ;;
            esac
          fi
          echo "file=$FILES" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Detected: $FILES (mode=$MODE)"

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install deps
        run: npm install dotenv

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Resolve caption from sidecar or input
        id: caption
        env:
          INPUT_FILE: ${{ steps.changed.outputs.file }}
          INPUT_CAPTION: ${{ inputs.caption }}
        run: |
          mkdir -p docs/copy
          STAMP=$(date +%Y-%m-%d-%H%M%S)
          OUT="docs/copy/$STAMP.flat.json"

          # Priority: workflow_dispatch input > .txt sidecar (same name) > caption.txt > fallback
          BASE="${INPUT_FILE%.*}"
          CAPTION=""
          if [[ -n "$INPUT_CAPTION" ]]; then
            CAPTION="$INPUT_CAPTION"
            echo "Using workflow_dispatch caption input"
          elif [[ -f "${BASE}.txt" ]]; then
            CAPTION="$(cat "${BASE}.txt")"
            echo "Using sidecar: ${BASE}.txt"
          elif [[ -f "incoming/caption.txt" ]]; then
            CAPTION="$(cat incoming/caption.txt)"
            echo "Using shared incoming/caption.txt"
          else
            CAPTION="$(basename "$INPUT_FILE")"
            echo "⚠️  No caption found — using filename: $CAPTION"
          fi

          # Pass caption via env, build copy.flat.json — same caption for ALL platforms
          export CAPTION_TEXT="$CAPTION"
          export OUT_PATH="$OUT"
          python3 -c "import json,os;c=os.environ['CAPTION_TEXT'];d={'x':c[:280],'instagram':c,'tiktok':c,'youtube':{'title':c.split(chr(10))[0][:100],'description':c}};open(os.environ['OUT_PATH'],'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2))"
          echo "FLAT_COPY=$OUT" >> "$GITHUB_ENV"
          echo "Caption preview: $(echo "$CAPTION" | head -c 120)..."

      - name: Build public URL
        id: url
        env:
          INPUT_FILE: ${{ steps.changed.outputs.file }}
          REPO_FULL: ${{ github.repository }}
        run: |
          echo "url=https://raw.githubusercontent.com/$REPO_FULL/main/$INPUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Post to all platforms
        env:
          INPUT_FILE: ${{ steps.changed.outputs.file }}
          INPUT_MODE: ${{ steps.changed.outputs.mode }}
          PUBLIC_URL: ${{ steps.url.outputs.url }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_AUDIT_PASSED: ${{ secrets.TIKTOK_AUDIT_PASSED }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_EXPECTED_CHANNEL_ID: ${{ secrets.YT_EXPECTED_CHANNEL_ID }}
        run: |
          node scripts/post-all-platforms.js \
            --mode "$INPUT_MODE" \
            --media "$INPUT_FILE" \
            --copy "$FLAT_COPY" \
            --public-url "$PUBLIC_URL"
